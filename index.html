<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Piano Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0c10;
  --surface: #14141c;
  --surface2: #1e1e2a;
  --border: #2a2a3a;
  --accent: #f0c060;
  --accent2: #60b0f0;
  --correct: #50d080;
  --wrong: #f05060;
  --text: #f0f0ec;
  --muted: #606078;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; overflow:hidden; }

/* LOADER */
#loader {
  position:fixed; inset:0; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; z-index:999; padding:40px;
}
#loader.hidden { display:none; }
.loader-logo { font-family:'Cormorant Garamond',serif; font-size:48px; color:var(--accent); }
.loader-sub { font-size:14px; color:var(--muted); text-align:center; line-height:1.6; max-width:320px; }
.loader-bar-bg { width:240px; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.loader-bar { height:100%; background:var(--accent); width:0%; transition:width .4s; border-radius:2px; }
.loader-msg { font-size:12px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
.start-btn {
  margin-top:8px; padding:16px 40px;
  background:var(--accent); color:#0c0c10;
  border:none; border-radius:50px;
  font-family:'Outfit',sans-serif; font-size:15px; font-weight:600;
  letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
  transition:transform .15s, background .15s;
}
.start-btn:active { transform:scale(.97); }

/* LAYOUT */
.app {
  display:flex; flex-direction:column; height:100vh;
}

/* HEADER */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; border-bottom:1px solid var(--border);
  background:var(--surface); flex-shrink:0;
}
.logo { font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--accent); }
.mic-status {
  display:flex; align-items:center; gap:8px;
  padding:6px 14px; border-radius:20px;
  border:1px solid var(--border); background:var(--surface2);
  font-size:12px; color:var(--muted);
}
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:all .2s; flex-shrink:0; }
.dot.on { background:var(--correct); box-shadow:0 0 8px var(--correct); }
.dot.hearing { background:var(--accent); box-shadow:0 0 10px var(--accent); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* TABS */
.tabs {
  display:flex; border-bottom:1px solid var(--border);
  background:var(--surface); flex-shrink:0; overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar { display:none; }
.tab {
  padding:13px 22px; font-size:13px; color:var(--muted);
  cursor:pointer; border-bottom:2px solid transparent;
  white-space:nowrap; transition:all .15s; flex-shrink:0;
  font-weight:500;
}
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* CONTENT */
.content {
  flex:1; display:flex; flex-direction:column;
  overflow:hidden; gap:0;
}

/* LESSON INFO */
.lesson-info {
  padding:16px 20px 12px; flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.lesson-title {
  font-family:'Cormorant Garamond',serif; font-size:26px;
  color:var(--text); margin-bottom:4px;
}
.lesson-desc { font-size:12px; color:var(--muted); line-height:1.6; }

/* NOTE SEQUENCE */
.sequence-section {
  padding:14px 20px; flex-shrink:0;
  border-bottom:1px solid var(--border);
}
.section-label {
  font-size:10px; text-transform:uppercase; letter-spacing:.12em;
  color:var(--muted); margin-bottom:10px;
}
.sequence-scroll { overflow-x:auto; scrollbar-width:none; }
.sequence-scroll::-webkit-scrollbar { display:none; }
.sequence {
  display:flex; gap:8px; min-width:max-content; padding-bottom:2px;
}
.ntile {
  width:52px; height:56px; border-radius:8px;
  border:1.5px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:16px; font-weight:600; color:var(--muted);
  transition:all .15s; flex-shrink:0;
}
.ntile .oc { font-size:9px; margin-top:2px; opacity:.7; }
.ntile.current {
  border-color:var(--accent); color:var(--accent);
  background:rgba(240,192,96,.1);
  box-shadow:0 0 16px rgba(240,192,96,.2);
  transform:scale(1.1);
}
.ntile.correct {
  border-color:var(--correct); color:var(--correct);
  background:rgba(80,208,128,.1);
}
.ntile.wrong {
  border-color:var(--wrong); color:var(--wrong);
  background:rgba(240,80,96,.1);
  animation:shake .25s ease;
}
.ntile.done {
  border-color:var(--border); color:var(--correct);
  background:rgba(80,208,128,.05); opacity:.6;
}
@keyframes shake { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-6px)} 70%{transform:translateX(6px)} }

/* DETECTION */
.detection-section {
  padding:14px 20px; flex-shrink:0;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:20px;
}
.big-detected {
  font-family:'Cormorant Garamond',serif;
  font-size:64px; font-weight:600; line-height:1;
  color:var(--muted); width:80px; text-align:center;
  transition:color .08s;
}
.big-detected.playing { color:var(--accent2); }
.big-detected.correct { color:var(--correct); }
.big-detected.wrong { color:var(--wrong); }
.det-right { flex:1; display:flex; flex-direction:column; gap:10px; }
.det-row { display:flex; align-items:center; gap:10px; }
.det-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; width:68px; flex-shrink:0; }
.bar-bg { flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; transition:width .06s; }
.vol-fill { background:var(--accent2); }
.conf-fill { background:var(--correct); }
.det-num { font-size:12px; color:var(--text); width:40px; text-align:right; flex-shrink:0; }
.target-row {
  display:flex; align-items:center; gap:8px;
  font-size:13px; color:var(--muted);
}
.target-note { font-size:18px; font-weight:600; color:var(--accent); }

/* CONTROLS */
.controls {
  padding:12px 20px; flex-shrink:0;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--border);
}
.ctrl-btn {
  padding:12px 28px; border-radius:8px;
  font-family:'Outfit',sans-serif; font-size:13px; font-weight:600;
  letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
  border:1.5px solid var(--border); transition:all .15s;
}
.ctrl-btn:active { transform:scale(.97); }
.ctrl-primary { background:var(--accent); color:#0c0c10; border-color:var(--accent); }
.ctrl-primary:disabled { opacity:.3; cursor:not-allowed; transform:none; }
.ctrl-ghost { background:transparent; color:var(--muted); }
.ctrl-ghost:hover { color:var(--text); border-color:var(--muted); }
.ctrl-status { flex:1; font-size:13px; color:var(--muted); line-height:1.5; }
.countdown-num {
  font-family:'Cormorant Garamond',serif; font-size:42px;
  color:var(--accent); width:50px; text-align:center; display:none;
}

/* PIANO */
.piano-section {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:16px 20px; overflow:hidden;
  background:var(--surface);
}
.piano-wrap {
  position:relative; overflow-x:auto; overflow-y:hidden;
  max-width:100%; scrollbar-width:none;
}
.piano-wrap::-webkit-scrollbar { display:none; }
.piano {
  position:relative; display:inline-flex;
  height:110px;
}
/* White keys */
.wk {
  width:38px; height:110px;
  background:linear-gradient(to bottom, #f5f2eb, #e8e4dc);
  border:1px solid #b0a898; border-radius:0 0 6px 6px;
  position:relative; flex-shrink:0; cursor:pointer;
  transition:background .08s;
  box-shadow:0 4px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.8);
}
.wk .klbl {
  position:absolute; bottom:7px; left:50%;
  transform:translateX(-50%);
  font-size:9px; color:#888; pointer-events:none;
  font-family:'Outfit',sans-serif;
}
/* Black keys */
.bk {
  width:24px; height:66px;
  background:linear-gradient(to bottom, #2a2a32, #111118);
  position:absolute; top:0; border-radius:0 0 4px 4px;
  z-index:2; cursor:pointer; transition:background .08s;
  box-shadow:2px 4px 10px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);
  border:1px solid #444;
}
/* Highlights */
.wk.hl-target { background:linear-gradient(to bottom, rgba(240,192,96,.7), rgba(240,192,96,.5)) !important; }
.wk.hl-correct { background:linear-gradient(to bottom, rgba(80,208,128,.8), rgba(80,208,128,.6)) !important; }
.wk.hl-wrong { background:linear-gradient(to bottom, rgba(240,80,96,.7), rgba(240,80,96,.5)) !important; }
.wk.hl-play { background:linear-gradient(to bottom, rgba(96,176,240,.6), rgba(96,176,240,.4)) !important; }
.bk.hl-target { background:rgba(240,192,96,.8) !important; }
.bk.hl-correct { background:rgba(80,208,128,.85) !important; }
.bk.hl-wrong { background:rgba(240,80,96,.8) !important; }
.bk.hl-play { background:rgba(96,176,240,.75) !important; }

/* RESULT OVERLAY */
.result-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(12,12,16,.9); backdrop-filter:blur(10px);
  z-index:100; align-items:center; justify-content:center; padding:20px;
}
.result-overlay.show { display:flex; }
.result-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; padding:36px; text-align:center;
  width:min(380px,100%);
}
.res-grade {
  font-family:'Cormorant Garamond',serif; font-size:90px; line-height:1;
  margin-bottom:4px;
}
.res-label {
  font-size:11px; text-transform:uppercase; letter-spacing:.12em;
  color:var(--muted); margin-bottom:24px;
}
.res-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px;
}
.res-stat {
  background:var(--surface2); border-radius:8px; padding:14px;
}
.res-stat-val {
  font-family:'Cormorant Garamond',serif; font-size:28px; color:var(--text);
  margin-bottom:4px;
}
.res-stat-lbl {
  font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em;
}
.res-btns { display:flex; gap:10px; justify-content:center; }
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-logo">♪ Piano</div>
  <div class="loader-sub">Your personal practice companion. Play notes shown — get instant feedback on every note.</div>
  <div class="loader-bar-bg"><div class="loader-bar" id="lBar"></div></div>
  <div class="loader-msg" id="lMsg">Tap to begin</div>
  <button class="start-btn" id="startAudioBtn">Allow Microphone & Start</button>
</div>

<!-- RESULT -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="res-grade" id="resGrade"></div>
    <div class="res-label">Exercise Complete</div>
    <div class="res-grid">
      <div class="res-stat"><div class="res-stat-val" id="resAcc"></div><div class="res-stat-lbl">Accuracy</div></div>
      <div class="res-stat"><div class="res-stat-val" id="resTune"></div><div class="res-stat-lbl">In-Tune</div></div>
      <div class="res-stat"><div class="res-stat-val" id="resTries"></div><div class="res-stat-lbl">Avg Tries</div></div>
      <div class="res-stat"><div class="res-stat-val" id="resTime"></div><div class="res-stat-lbl">Time</div></div>
    </div>
    <div class="res-btns">
      <button class="ctrl-btn ctrl-ghost" id="resRetry">Retry</button>
      <button class="ctrl-btn ctrl-primary" id="resNext">Next Lesson →</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="header">
    <div class="logo">♪ Piano Practice</div>
    <div class="mic-status">
      <div class="dot" id="micDot"></div>
      <span id="micTxt">Mic off</span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="content">
    <div class="lesson-info">
      <div class="lesson-title" id="lTitle">–</div>
      <div class="lesson-desc" id="lDesc">–</div>
    </div>

    <div class="sequence-section">
      <div class="section-label">Notes to play in order</div>
      <div class="sequence-scroll">
        <div class="sequence" id="seq"></div>
      </div>
    </div>

    <div class="detection-section">
      <div class="big-detected" id="bigNote">–</div>
      <div class="det-right">
        <div class="det-row">
          <span class="det-lbl">Volume</span>
          <div class="bar-bg"><div class="bar-fill vol-fill" id="volBar" style="width:0%"></div></div>
          <span class="det-num" id="volNum">–</span>
        </div>
        <div class="det-row">
          <span class="det-lbl">Confidence</span>
          <div class="bar-bg"><div class="bar-fill conf-fill" id="confBar" style="width:0%"></div></div>
          <span class="det-num" id="confNum">–</span>
        </div>
        <div class="target-row">
          <span>Target:</span>
          <span class="target-note" id="targetNote">–</span>
          <span id="centsDisplay" style="font-size:11px;color:var(--muted);margin-left:8px;"></span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn ctrl-primary" id="startBtn" disabled>Start</button>
      <button class="ctrl-btn ctrl-ghost" id="retryBtn" style="display:none">Retry</button>
      <div class="countdown-num" id="cdNum"></div>
      <div class="ctrl-status" id="statusMsg">Loading…</div>
    </div>

    <div class="piano-section">
      <div class="piano-wrap">
        <div class="piano" id="piano"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════
// LESSONS
// ═══════════════════════════
const LESSONS = [
  {
    id:0, title:"C Major Scale",
    desc:"Play C D E F G A B C up, then back down. Right hand. Start on Middle C (C4). Focus on one clear note at a time.",
    notes:["C4","D4","E4","F4","G4","A4","B4","C5","B4","A4","G4","F4","E4","D4","C4"]
  },
  {
    id:1, title:"Five-Finger Exercise",
    desc:"Five fingers, five notes: C D E F G and back. Thumb on C, pinky on G. Keep wrist relaxed.",
    notes:["C4","D4","E4","F4","G4","F4","E4","D4","C4"]
  },
  {
    id:2, title:"Ode to Joy",
    desc:"Beethoven's famous melody. Your first real song. Take it slow — get each note right before moving on.",
    notes:["E4","E4","F4","G4","G4","F4","E4","D4","C4","C4","D4","E4","E4","D4","D4"]
  }
];

// ═══════════════════════════
// NOTE UTILS
// ═══════════════════════════
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WHITE_NOTES = ['C','D','E','F','G','A','B'];

function noteToFreq(str) {
  const m = str.match(/^([A-G]#?)(\d+)$/);
  if (!m) return null;
  const idx = NOTE_NAMES.indexOf(m[1]);
  const midi = (parseInt(m[2]) + 1) * 12 + idx;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function freqToNoteObj(freq) {
  if (!freq || freq < 50) return null;
  const midi = 69 + 12 * Math.log2(freq / 440);
  const midiR = Math.round(midi);
  const cents = Math.abs((midi - midiR) * 100);
  const oct = Math.floor(midiR / 12) - 1;
  const idx = ((midiR % 12) + 12) % 12;
  return { name: NOTE_NAMES[idx] + oct, noteName: NOTE_NAMES[idx], oct, cents, midi: midiR };
}

// ═══════════════════════════
// PITCH DETECTION
// MPM — fast, works well for piano
// ═══════════════════════════
function mpmDetect(buf, sr) {
  const n = buf.length;
  const nsdf = new Float32Array(n);
  for (let tau = 0; tau < n; tau++) {
    let acf = 0, m = 0;
    for (let i = 0; i < n - tau; i++) {
      acf += buf[i] * buf[i+tau];
      m += buf[i]*buf[i] + buf[i+tau]*buf[i+tau];
    }
    nsdf[tau] = m < 1e-10 ? 0 : 2*acf/m;
  }
  const peaks = [];
  let pos = false;
  for (let i = 1; i < n-1; i++) {
    if (nsdf[i] > 0) pos = true;
    if (pos && nsdf[i] > nsdf[i-1] && nsdf[i] >= nsdf[i+1]) peaks.push(i);
    if (nsdf[i] < 0) pos = false;
  }
  if (!peaks.length) return null;
  const maxVal = Math.max(...peaks.map(i => nsdf[i]));
  const thresh = 0.65 * maxVal;
  const sel = peaks.find(i => nsdf[i] >= thresh);
  if (!sel) return null;
  const y0 = nsdf[sel-1]||0, y1 = nsdf[sel], y2 = nsdf[sel+1]||0;
  const denom = 2*(2*y1-y0-y2);
  const tau = denom ? sel+(y2-y0)/denom : sel;
  const freq = sr/tau;
  if (freq < 55 || freq > 2200) return null;
  return { freq, clarity: Math.min(1, y1) };
}

// YIN — better for sustained tones
function yinDetect(buf, sr) {
  const half = buf.length >> 1;
  const d = new Float32Array(half);
  d[0] = 1;
  let runSum = 0;
  for (let tau = 1; tau < half; tau++) {
    let s = 0;
    for (let i = 0; i < half; i++) {
      const diff = buf[i] - buf[i+tau];
      s += diff*diff;
    }
    d[tau] = s;
    runSum += s;
    d[tau] = runSum > 0 ? (d[tau]*tau)/runSum : 1;
  }
  for (let tau = 2; tau < half; tau++) {
    if (d[tau] < 0.12) {
      while (tau+1 < half && d[tau+1] < d[tau]) tau++;
      const freq = sr/tau;
      if (freq < 55 || freq > 2200) return null;
      return { freq, clarity: Math.max(0, 1-d[tau]) };
    }
  }
  return null;
}

// ═══════════════════════════
// PIANO BUILDER
// ═══════════════════════════
function buildPiano() {
  const piano = document.getElementById('piano');
  piano.innerHTML = '';
  const whites = [];
  // Octaves 3,4,5
  for (let oct = 3; oct <= 5; oct++) {
    WHITE_NOTES.forEach(n => {
      const el = document.createElement('div');
      el.className = 'wk';
      el.dataset.note = n + oct;
      if (n === 'C') {
        const lbl = document.createElement('div');
        lbl.className = 'klbl';
        lbl.textContent = 'C'+oct;
        el.appendChild(lbl);
      }
      piano.appendChild(el);
      whites.push({ el, n, oct, idx: whites.length });
    });
  }
  piano.style.width = (whites.length * 38) + 'px';

  // Black keys
  whites.forEach((w, i) => {
    if (!['C','D','F','G','A'].includes(w.n)) return;
    const sharpName = NOTE_NAMES[NOTE_NAMES.indexOf(w.n)+1];
    if (!sharpName || !sharpName.includes('#')) return;
    const bk = document.createElement('div');
    bk.className = 'bk';
    bk.dataset.note = sharpName + w.oct;
    bk.style.left = (i * 38 + 24) + 'px';
    piano.appendChild(bk);
  });
}

function clearKeys() {
  document.querySelectorAll('.wk,.bk').forEach(k =>
    k.classList.remove('hl-target','hl-correct','hl-wrong','hl-play'));
}

function hlKey(note, type) {
  if (!note) return;
  const el = document.querySelector(`[data-note="${note}"]`);
  if (el) el.classList.add('hl-'+type);
}

// ═══════════════════════════
// APP STATE
// ═══════════════════════════
let audioCtx, analyser;
let appState = 'idle';
let lessonIdx = 0, lesson = null;
let noteIdx = 0;
let triesPerNote = [], centsLog = [], noteAccepted = [];
let currentTries = 0, startTime = 0;
let lastNoteObj = null, lastNoteTime = 0;
let consecutiveFrames = 0;
let lastAcceptedNote = '', lastAcceptTime = 0;
const LINGER_MS = 350;
const FRAMES_NEEDED = 2;      // frames of consistent detection before accepting
const REACCEPT_MS = 500;      // min gap before accepting same note again
const SEMI_TOL = 0.75;        // semitone tolerance
const VOL_THRESHOLD = 0.004;  // LOWERED — was 0.010, piano can be quiet through mic

// ═══════════════════════════
// AUDIO INIT
// ═══════════════════════════
async function initAudio() {
  setLMsg('Requesting microphone access…', 40);
  document.getElementById('startAudioBtn').disabled = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        sampleRate: 44100
      }
    });
    setLMsg('Starting audio engine…', 70);
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 8192; // larger = better low-freq resolution
    analyser.smoothingTimeConstant = 0.2;
    src.connect(analyser);
    setLMsg('Ready!', 100);
    document.getElementById('micDot').className = 'dot on';
    document.getElementById('micTxt').textContent = 'Mic on';
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
      buildPiano();
      renderTabs();
      selectLesson(0);
      audioLoop();
    }, 500);
  } catch(e) {
    setLMsg('Mic denied — please allow microphone and reload', 100);
    document.getElementById('startAudioBtn').disabled = false;
    console.error(e);
  }
}

function setLMsg(msg, pct) {
  document.getElementById('lMsg').textContent = msg;
  document.getElementById('lBar').style.width = pct + '%';
}

// ═══════════════════════════
// AUDIO LOOP
// ═══════════════════════════
function audioLoop() {
  const bufLen = analyser.fftSize;
  const buf = new Float32Array(bufLen);

  function tick() {
    requestAnimationFrame(tick);
    analyser.getFloatTimeDomainData(buf);

    // RMS volume
    let sum = 0;
    for (let i = 0; i < bufLen; i++) sum += buf[i]*buf[i];
    const rms = Math.sqrt(sum / bufLen);
    const volPct = Math.min(100, rms * 800); // boosted display

    document.getElementById('volBar').style.width = volPct + '%';
    document.getElementById('volNum').textContent = Math.round(volPct) + '%';

    const now = Date.now();
    const hasSound = rms > VOL_THRESHOLD;

    // Mic activity dot
    document.getElementById('micDot').className = hasSound ? 'dot hearing' : 'dot on';

    let detected = null;

    if (hasSound) {
      // Run both detectors
      const r1 = mpmDetect(buf, audioCtx.sampleRate);
      const r2 = yinDetect(buf, audioCtx.sampleRate);
      let best = null;
      if (r1 && r2) best = (r1.clarity >= r2.clarity) ? r1 : r2;
      else best = r1 || r2;

      if (best && best.clarity > 0.4) { // lowered threshold
        const obj = freqToNoteObj(best.freq);
        if (obj) {
          lastNoteObj = { ...obj, clarity: best.clarity };
          lastNoteTime = now;
        }
      }
    } else {
      consecutiveFrames = 0;
    }

    // Linger: keep showing last note briefly
    detected = (lastNoteObj && (now - lastNoteTime) < LINGER_MS) ? lastNoteObj : null;

    // Update big note display
    const bigEl = document.getElementById('bigNote');
    if (detected) {
      bigEl.textContent = detected.noteName;
      bigEl.className = 'big-detected playing';
      document.getElementById('confBar').style.width = Math.round(detected.clarity * 100) + '%';
      document.getElementById('confNum').textContent = Math.round(detected.clarity * 100) + '%';
      document.getElementById('centsDisplay').textContent = Math.round(detected.cents) + '¢ off';
      if (appState !== 'listening') { clearKeys(); hlKey(detected.name, 'play'); }
    } else {
      bigEl.textContent = '–';
      bigEl.className = 'big-detected';
      document.getElementById('confBar').style.width = '0%';
      document.getElementById('confNum').textContent = '–';
      document.getElementById('centsDisplay').textContent = '';
      if (appState !== 'listening') clearKeys();
    }

    // Exercise processing
    if (appState === 'listening' && detected && hasSound) {
      evalNote(detected, now);
    }
  }
  tick();
}

// ═══════════════════════════
// EXERCISE EVAL
// ═══════════════════════════
function evalNote(det, now) {
  if (!lesson || noteIdx >= lesson.notes.length) return;
  const target = lesson.notes[noteIdx];
  const tFreq = noteToFreq(target);
  const dFreq = noteToFreq(det.name);
  if (!tFreq || !dFreq) return;

  const semiDiff = Math.abs(12 * Math.log2(dFreq / tFreq));
  const correct = semiDiff <= SEMI_TOL;

  if (correct) {
    // Debounce: require N consecutive frames
    if (det.name === (lastNoteObj?.name)) consecutiveFrames++;
    else consecutiveFrames = 1;

    if (consecutiveFrames < FRAMES_NEEDED) return;

    // Re-accept gap for same note played twice in a row
    if (det.name === lastAcceptedNote && (now - lastAcceptTime) < REACCEPT_MS) return;

    consecutiveFrames = 0;

    // ACCEPT
    centsLog.push(det.cents);
    triesPerNote.push(currentTries + 1);
    noteAccepted.push(true);
    lastAcceptedNote = det.name;
    lastAcceptTime = now;
    currentTries = 0;

    const tile = document.getElementById('nt'+noteIdx);
    if (tile) tile.className = 'ntile correct';
    clearKeys();
    hlKey(det.name, 'correct');

    noteIdx++;

    if (noteIdx >= lesson.notes.length) {
      setTimeout(finishEx, 600);
      return;
    }

    const nextTarget = lesson.notes[noteIdx];
    const nextTile = document.getElementById('nt'+noteIdx);
    if (nextTile) { nextTile.className = 'ntile current'; nextTile.scrollIntoView({inline:'center',behavior:'smooth'}); }
    clearKeys();
    hlKey(nextTarget, 'target');
    document.getElementById('targetNote').textContent = nextTarget;
    document.getElementById('statusMsg').textContent = `▶ Note ${noteIdx+1} / ${lesson.notes.length}  —  play  ${nextTarget}`;
    document.getElementById('bigNote').className = 'big-detected correct';

  } else {
    consecutiveFrames = 0;
    const tile = document.getElementById('nt'+noteIdx);
    if (tile && !tile._wrongActive) {
      tile._wrongActive = true;
      tile.className = 'ntile wrong';
      clearKeys();
      hlKey(det.name, 'wrong');
      hlKey(target, 'target');
      currentTries++;
      setTimeout(() => {
        if (tile) { tile.className = 'ntile current'; tile._wrongActive = false; }
        hlKey(target, 'target');
      }, 500);
    }
  }
}

// ═══════════════════════════
// LESSON UI
// ═══════════════════════════
function renderTabs() {
  const t = document.getElementById('tabs');
  t.innerHTML = '';
  LESSONS.forEach((l,i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (i===lessonIdx?' active':'');
    tab.textContent = l.title;
    tab.addEventListener('click', () => {
      if (appState==='listening'||appState==='countdown') return;
      selectLesson(i);
    });
    t.appendChild(tab);
  });
}

function selectLesson(idx) {
  lessonIdx = idx; lesson = LESSONS[idx];
  appState = 'idle';
  noteIdx = 0; triesPerNote = []; centsLog = []; noteAccepted = [];
  currentTries = 0; consecutiveFrames = 0;
  lastAcceptedNote = ''; lastAcceptTime = 0;

  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active',i===idx));
  document.getElementById('lTitle').textContent = lesson.title;
  document.getElementById('lDesc').textContent = lesson.desc;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('statusMsg').textContent = 'Ready — hit Start when you are';
  document.getElementById('targetNote').textContent = lesson.notes[0];
  document.getElementById('resultOverlay').classList.remove('show');
  renderSeq();
  clearKeys();
  hlKey(lesson.notes[0], 'target');
}

function renderSeq() {
  const seq = document.getElementById('seq');
  seq.innerHTML = '';
  lesson.notes.forEach((note, i) => {
    const tile = document.createElement('div');
    tile.className = 'ntile' + (i===0?' current':'');
    tile.id = 'nt'+i;
    const nn = note.replace(/\d/,'');
    const oc = note.match(/\d+/)?.[0]||'';
    tile.innerHTML = nn + `<span class="oc">${oc}</span>`;
    seq.appendChild(tile);
  });
}

// ═══════════════════════════
// COUNTDOWN
// ═══════════════════════════
function startCountdown() {
  appState = 'countdown';
  document.getElementById('startBtn').disabled = true;
  document.getElementById('retryBtn').style.display = 'none';
  const cd = document.getElementById('cdNum');
  cd.style.display = 'block';
  document.getElementById('statusMsg').textContent = 'Get ready…';
  let n = 3; cd.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(iv); cd.style.display='none'; beginEx(); }
    else cd.textContent = n;
  }, 800);
}

function beginEx() {
  appState = 'listening';
  noteIdx = 0; triesPerNote = []; centsLog = []; noteAccepted = [];
  currentTries = 0; consecutiveFrames = 0;
  lastAcceptedNote = ''; lastAcceptTime = 0;
  startTime = Date.now();
  renderSeq();
  clearKeys();
  hlKey(lesson.notes[0], 'target');
  document.getElementById('targetNote').textContent = lesson.notes[0];
  document.getElementById('statusMsg').textContent = `▶ Note 1 / ${lesson.notes.length}  —  play  ${lesson.notes[0]}`;
}

// ═══════════════════════════
// FINISH
// ═══════════════════════════
function finishEx() {
  appState = 'done';
  clearKeys();
  const elapsed = ((Date.now()-startTime)/1000).toFixed(1);
  const acc = Math.round((noteAccepted.filter(Boolean).length / lesson.notes.length)*100);
  const avgTries = triesPerNote.length
    ? (triesPerNote.reduce((a,b)=>a+b,0)/triesPerNote.length).toFixed(1) : '1.0';
  const avgCents = centsLog.length
    ? centsLog.reduce((a,b)=>a+b,0)/centsLog.length : 0;
  const inTune = Math.max(0, Math.round(100 - avgCents * 1.6));

  let grade, color;
  if (acc>=95){grade='A';color='var(--correct)';}
  else if(acc>=80){grade='B';color='var(--accent)';}
  else if(acc>=65){grade='C';color='var(--accent2)';}
  else{grade='D';color='var(--wrong)';}

  document.getElementById('resGrade').textContent = grade;
  document.getElementById('resGrade').style.color = color;
  document.getElementById('resAcc').textContent = acc+'%';
  document.getElementById('resTune').textContent = inTune+'%';
  document.getElementById('resTries').textContent = avgTries;
  document.getElementById('resTime').textContent = elapsed+'s';
  document.getElementById('resultOverlay').classList.add('show');
  document.getElementById('startBtn').disabled = false;
  document.getElementById('retryBtn').style.display = '';
  document.getElementById('statusMsg').textContent = 'Done!';
}

function retry() {
  document.getElementById('resultOverlay').classList.remove('show');
  selectLesson(lessonIdx);
}

// ═══════════════════════════
// EVENTS
// ═══════════════════════════
document.getElementById('startAudioBtn').addEventListener('click', initAudio);
document.getElementById('startBtn').addEventListener('click', startCountdown);
document.getElementById('retryBtn').addEventListener('click', retry);
document.getElementById('resRetry').addEventListener('click', retry);
document.getElementById('resNext').addEventListener('click', () => {
  const next = (lessonIdx+1) % LESSONS.length;
  document.getElementById('resultOverlay').classList.remove('show');
  selectLesson(next);
  renderTabs();
});
window.addEventListener('resize', buildPiano);
</script>
